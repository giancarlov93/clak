<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clak — permission</title>
  <link rel="stylesheet" href="clak.css">
  <link rel="stylesheet" href="consent.css">
</head>
<body>
  <div class="titlebar" data-tauri-drag-region></div>
  <main id="content">
    <div id="sheet">
      <header>
        <span id="icon" class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 2.5 4 5.5v6c0 4.8 3.4 8.9 8 10 4.6-1.1 8-5.2 8-10v-6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m8.5 12 2.4 2.4 4.6-4.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <div>
          <h1 id="heading"></h1>
          <p id="question"></p>
        </div>
      </header>
      <div id="warning" class="warning hidden"></div>
      <div id="summary" class="card summary"></div>
      <div id="page-block" class="hidden">
        <h2>Page</h2>
        <div id="page" class="card"></div>
        <p id="page-state" class="quiet"></p>
      </div>
      <div id="form-block" class="hidden">
        <div id="form"></div>
        <p id="form-error" class="field-error" role="alert"></p>
      </div>
      <div id="tools-block">
        <h2 id="tools-heading">Commands</h2>
        <div id="tools"></div>
      </div>
      <details id="details">
        <summary>Details</summary>
        <div class="details-body">
          <dl id="who" class="lines"></dl>
          <dl id="what" class="lines"></dl>
        </div>
      </details>
      <p id="note" class="quiet"></p>
    </div>
  </main>
  <section id="decide" class="hidden">
    <fieldset id="scope" class="scope hidden">
      <legend>Allow</legend>
    </fieldset>
    <label id="always-row" class="always hidden"><input id="always" type="checkbox"><span id="always-text"></span></label>
  </section>
  <footer>
    <div class="left">
      <span class="quiet"><span id="queue" class="queue hidden"></span><span id="countdown"></span></span>
      <button id="block" class="link danger hidden" type="button" disabled></button>
    </div>
    <div class="buttons">
      <button id="deny" disabled>Deny</button>
      <button id="allow" class="accent" disabled>Allow</button>
    </div>
  </footer>
  <script src="clak.js"></script>
  <script src="form.js"></script>
  <script src="consent.js"></script>
</body>
</html>
