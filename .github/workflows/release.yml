# On every push to main: tests, installers for Windows and Mac, a GitHub release.
#
# The version is X.Y from the root Cargo.toml plus the run number: 0.3.0 in Cargo.toml
# gives 0.3.17 on the seventeenth run. To move to 0.4, just change it there.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: v
        run: |
          base=$(node scripts/version.mjs | cut -d. -f1,2)
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    # The signing secrets live only in this environment, which GitHub gives only to runs
    # from main: a workflow pushed on another branch asks for it and is refused.
    environment: release
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            test: true
            files: nsis/*-setup.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            test: true
            files: dmg/*.dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            test: false
            files: dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "^2" --locked

      - name: Version
        shell: bash
        run: node scripts/version.mjs "${{ needs.version.outputs.version }}"

      - name: Test
        if: matrix.test
        shell: bash
        run: cargo test

      # The Mac: signed with the Developer ID and notarized, if the repository has the secrets
      # (without them, signed ad hoc as before). The API key arrives as text: here it becomes
      # the file Tauri wants, in the runner's temporary folder.
      - name: App Store Connect key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [ -n "$APPLE_API_PRIVATE_KEY" ]; then
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      - name: Installer
        shell: bash
        env:
          # Tauri imports the certificate (.p12 in base64) into a keychain of its own.
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
        run: node scripts/bundle.mjs --target "${{ matrix.target }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clak-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -l dist
          gh release create "v$VERSION" dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Clak $VERSION" \
            --generate-notes
