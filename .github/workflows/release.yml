# Once the checks pass on main (checks.yml, which runs the tests): installers for Windows and
# Mac, archives for Linux, and a GitHub release, of the very commit the checks ran on. Red
# checks, no release.
#
# The version is X.Y from the root Cargo.toml plus the run number: 0.3.0 in Cargo.toml
# gives 0.3.17 on the seventeenth run. To move to 0.4, just change it there.
name: Release

on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  # The commit the checks passed on; by hand, the head of main.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  version:
    # Only the checks of a push to main that passed: not a pull request's, not a red or
    # cancelled run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.SHA }}
      - id: v
        run: |
          base=$(node scripts/version.mjs | cut -d. -f1,2)
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    # The signing secrets live only in this environment, which GitHub gives only to runs
    # from main: a workflow pushed on another branch asks for it and is refused.
    environment: release
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.SHA }}

      # The Rust of rust-toolchain.toml (rustup is already on the runners), with this target.
      # Only that one: rust-cache puts every installed toolchain in its key, and the runner
      # images come with different ones (as in checks.yml).
      - name: Rust
        shell: bash
        run: |
          rustup toolchain install
          active=$(rustup show active-toolchain | cut -d' ' -f1)
          rustup default "$active"
          for toolchain in $(rustup toolchain list --quiet | tr -d '\r'); do
            if [ "$toolchain" != "$active" ]; then rustup toolchain uninstall "$toolchain"; fi
          done
          rustup target add "${{ matrix.target }}"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Tauri CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_CLI: 2.12.3
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          dir="$RUNNER_TEMP/tauri-cli"
          gh release download "tauri-cli-v$TAURI_CLI" --repo tauri-apps/tauri \
            --pattern "cargo-tauri-$host.zip" --dir "$dir"
          unzip -q -o "$dir/cargo-tauri-$host.zip" -d "$dir"
          bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          find "$dir" -type f -name 'cargo-tauri*' ! -name '*.zip' -exec mv -f {} "$bin/" \;
          chmod +x "$bin"/cargo-tauri*
          cargo tauri --version

      - name: Version
        shell: bash
        run: node scripts/version.mjs "${{ needs.version.outputs.version }}"

      # The Mac: signed with the Developer ID if the repository has the secrets (without them,
      # signed ad hoc as before). With the updater key, the files for the updater too.
      - name: Installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Tauri imports the certificate (.p12 in base64) into a keychain of its own.
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        run: node scripts/bundle.mjs --target "${{ matrix.target }}"

      # Sent to Apple without waiting, so the release doesn't wait on it.
      - name: Notarize
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_API_PRIVATE_KEY" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "No Developer ID or App Store Connect key: not notarized."
            exit 0
          fi
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key"
          zip="$RUNNER_TEMP/Clak.zip"
          ditto -c -k --keepParent "target/${{ matrix.target }}/release/bundle/macos/Clak.app" "$zip"
          id=$(xcrun notarytool submit "$zip" --key "$key" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --no-wait --output-format json | jq -r .id)
          rm -f "$key"
          echo "Notarization of ${{ matrix.target }} sent to Apple: \`$id\`" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Check it with \`xcrun notarytool info $id\`." >> "$GITHUB_STEP_SUMMARY"

      # The two Mac builds both make Clak.app.tar.gz: named by architecture, like the dmg.
      - name: Files
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          bundle="target/${{ matrix.target }}/release/bundle"
          mkdir -p dist
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$bundle"/nsis/*-setup.exe* dist/
          else
            cp "$bundle"/dmg/*.dmg dist/
            for file in Clak.app.tar.gz Clak.app.tar.gz.sig; do
              if [ -f "$bundle/macos/$file" ]; then
                cp "$bundle/macos/$file" "dist/${file/Clak/Clak_${VERSION}_${{ matrix.arch }}}"
              fi
            done
          fi
          ls -l dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clak-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Linux: clak, clak-shim and the hub without an interface (clak-daemon), for servers and
  # containers; no app. Linked statically (musl), so one archive runs on any distribution.
  # Nothing is signed, so no secrets and no environment.
  linux:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            arch: x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.SHA }}

      # As in build.
      - name: Rust
        shell: bash
        run: |
          rustup toolchain install
          active=$(rustup show active-toolchain | cut -d' ' -f1)
          rustup default "$active"
          for toolchain in $(rustup toolchain list --quiet | tr -d '\r'); do
            if [ "$toolchain" != "$active" ]; then rustup toolchain uninstall "$toolchain"; fi
          done
          rustup target add "${{ matrix.target }}"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      # The C compiler for musl, for what ring (rustls) compiles.
      - name: musl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Version
        shell: bash
        run: node scripts/version.mjs "${{ needs.version.outputs.version }}"

      - name: Build
        shell: bash
        env:
          TARGET_CC: musl-gcc
        run: cargo build --release -p clak-agent -p clak-daemon --target "${{ matrix.target }}"

      # The binaries, Clak's license and the notices of their dependencies, in a folder named
      # like the archive. That they run, and are static, before they go.
      - name: Files
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          bin="target/${{ matrix.target }}/release"
          name="clak_${VERSION}_linux_${{ matrix.arch }}"
          mkdir -p "stage/$name" dist
          cp "$bin/clak" "$bin/clak-shim" "$bin/clak-daemon" LICENSE "stage/$name/"
          node scripts/notices.mjs --target "${{ matrix.target }}" --crates clak-agent,clak-daemon \
            --out "stage/$name/THIRD-PARTY-NOTICES.txt"
          test "$("stage/$name/clak" version)" = "clak $VERSION"
          for file in clak clak-shim clak-daemon; do
            file "stage/$name/$file" | tee /dev/stderr | grep -qE 'statically linked|static-pie linked'
          done
          tar -C stage -czf "dist/$name.tar.gz" "$name"
          ls -l dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clak-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [version, build, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.SHA }}
          sparse-checkout: |
            CHANGELOG.md
            scripts/updater-manifest.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      # The notes: the changelog's Unreleased section first, then what GitHub generates.
      # latest.json is what the installed apps' updater reads.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -l dist
          awk '/^## \[Unreleased\]/ { on = 1; next } /^## \[/ { on = 0 } on' CHANGELOG.md > notes.md
          node scripts/updater-manifest.mjs dist "$VERSION" "${{ github.repository }}" notes.md
          gh release create "v$VERSION" dist/* \
            --repo "${{ github.repository }}" \
            --target "$SHA" \
            --title "Clak $VERSION" \
            --notes-file notes.md \
            --generate-notes
