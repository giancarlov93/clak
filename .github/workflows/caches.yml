# The caches the pull requests start from. Only main saves them (a pull request's stay its own),
# and on main nothing runs the checks: their builds are made here, without checking or running
# anything, when a merge changes what goes in them (Cargo.lock, a Cargo.toml, the toolchain, the
# checks). Alongside the release, holding nothing up.
name: Caches

on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - rust-toolchain.toml
      - .github/workflows/checks.yml
      - .github/workflows/caches.yml
  workflow_dispatch:

concurrency:
  group: caches
  cancel-in-progress: true

permissions:
  contents: read

# As in checks.yml: part of the caches' keys.
env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # The job ids are those of checks.yml: rust-cache keys a cache by job id, system, Rust, the
  # environment and the lockfile, so the pull requests' checks find these. The steps up to the
  # cache are the same too.
  clippy-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust
        shell: bash
        run: |
          rustup toolchain install
          active=$(rustup show active-toolchain | cut -d' ' -f1)
          rustup default "$active"
          for toolchain in $(rustup toolchain list --quiet | tr -d '\r'); do
            if [ "$toolchain" != "$active" ]; then rustup toolchain uninstall "$toolchain"; fi
          done
      # Already saved for exactly these keys: nothing to build.
      - id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build for clippy
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo clippy --workspace --all-targets --locked
      - name: Build the tests
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo test --workspace --locked --no-run

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust
        shell: bash
        run: |
          rustup toolchain install
          active=$(rustup show active-toolchain | cut -d' ' -f1)
          rustup default "$active"
          for toolchain in $(rustup toolchain list --quiet | tr -d '\r'); do
            if [ "$toolchain" != "$active" ]; then rustup toolchain uninstall "$toolchain"; fi
          done
      # Already saved for exactly these keys: nothing to build.
      - id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build for clippy
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo clippy --workspace --exclude clak-app --all-targets --locked
      - name: Build the tests
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo test --workspace --exclude clak-app --locked --no-run

  coverage:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust
        shell: bash
        run: |
          rustup toolchain install
          active=$(rustup show active-toolchain | cut -d' ' -f1)
          rustup default "$active"
          for toolchain in $(rustup toolchain list --quiet | tr -d '\r'); do
            if [ "$toolchain" != "$active" ]; then rustup toolchain uninstall "$toolchain"; fi
          done
          rustup component add llvm-tools
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov
      # Already saved for exactly these keys: nothing to build.
      - id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build for clippy
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo clippy --workspace --all-targets --locked
      # The tests built for coverage and only listed, not run.
      - name: Build the tests for coverage
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo llvm-cov --workspace --locked --no-report -- --list
      # The doc tests can't be built without running: there is one.
      - name: Doc tests
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo test --workspace --locked --doc
