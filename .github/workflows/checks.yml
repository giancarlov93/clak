# On every pull request, and on main: formatting, clippy and the tests, before review. On main
# a green run starts the release (release.yml); the same files already checked on their pull
# request are not checked again.
# No secrets and no environment here: it runs the same for a fork.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # On main: whether the files of this commit are those of a pull request whose checks passed.
  # With a rebase the commits change but, if main hadn't moved, the files (the tree) don't.
  # A direct push, a pull request not found or a doubt: everything runs.
  needed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      run: ${{ steps.look.outputs.run }}
    steps:
      - id: look
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tree() { gh api "repos/$REPO/git/commits/$1" --jq .tree.sha || true; }
            pulls="repos/$REPO/commits/$SHA/pulls"
            head=$(gh api "$pulls" --jq '[.[] | select(.merged_at != null)][0].head.sha // empty' || true)
            mine=$(tree "$SHA")
            if [ -n "$head" ] && [ -n "$mine" ] && [ "$(tree "$head")" = "$mine" ]; then
              runs="repos/$REPO/actions/workflows/checks.yml/runs?head_sha=$head&event=pull_request&status=success"
              passed=$(gh api "$runs" --jq .total_count || echo 0)
              if [ "${passed:-0}" -gt 0 ]; then
                run=false
                echo "The same files passed on their pull request ($head): nothing to check again." >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  fmt:
    needs: needed
    if: needs.needed.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust
        run: rustup toolchain install
      - name: cargo fmt
        run: cargo fmt --all --check

  # clippy and the tests on both systems: much of the code is #[cfg(windows)] or macOS only.
  # The whole workspace, the Tauri app included.
  clippy-test:
    needs: needed
    if: needs.needed.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        shell: bash
        run: cargo test --workspace --locked

  # The share of lines the tests run through, on the Mac: below the floor the check fails.
  # The figures go in the run's summary, the report (HTML and lcov) among its artifacts.
  # To raise the floor as the tests grow, change COVERAGE_FLOOR.
  coverage:
    needs: needed
    if: needs.needed.outputs.run == 'true'
    runs-on: macos-latest
    env:
      COVERAGE_FLOOR: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust
        shell: bash
        run: |
          rustup toolchain install
          rustup component add llvm-tools
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Tests with coverage
        shell: bash
        run: cargo llvm-cov --workspace --locked --no-report
      - name: Report
        shell: bash
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --html --output-dir coverage
          {
            echo "## Coverage"
            echo
            echo '```'
            cargo llvm-cov report --summary-only | sed -n '1p;$p'
            echo '```'
            echo
            echo "The floor for lines is $COVERAGE_FLOOR%."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: |
            lcov.info
            coverage/html
      - name: Floor
        shell: bash
        run: cargo llvm-cov report --summary-only --fail-under-lines "$COVERAGE_FLOOR" > /dev/null
