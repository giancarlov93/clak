# On every pull request, and on main: formatting, clippy and the tests, before review. On main
# a green run starts the release (release.yml); the same files already checked on their pull
# request are not checked again.
# No secrets and no environment here: it runs the same for a fork.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The same in caches.yml: these are part of the caches' keys.
env:
  CARGO_TERM_COLOR: always
  # No debug info in these builds: a failing test still says its file and line, coverage
  # doesn't need it, and the tests link faster (on Windows above all) into smaller caches.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # On main: whether the files of this commit are those of a pull request whose checks passed.
  # With a rebase the commits change but, if main hadn't moved, the files (the tree) don't.
  # A direct push, a pull request not found or a doubt: everything runs.
  # Only main saves the caches the pull requests start from: when this skips, caches.yml
  # builds them after it, if the push changed what goes in them.
  needed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      run: ${{ steps.look.outputs.run }}
    steps:
      - id: look
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tree() { gh api "repos/$REPO/git/commits/$1" --jq .tree.sha || true; }
            pulls="repos/$REPO/commits/$SHA/pulls"
            head=$(gh api "$pulls" --jq '[.[] | select(.merged_at != null)][0].head.sha // empty' || true)
            mine=$(tree "$SHA")
            if [ -n "$head" ] && [ -n "$mine" ] && [ "$(tree "$head")" = "$mine" ]; then
              runs="repos/$REPO/actions/workflows/checks.yml/runs?head_sha=$head&event=pull_request&status=success"
              passed=$(gh api "$runs" --jq .total_count || echo 0)
              if [ "${passed:-0}" -gt 0 ]; then
                run=false
                echo "The same files passed on their pull request ($head): nothing to check again." >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  fmt:
    needs: needed
    if: needs.needed.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust
        run: rustup toolchain install
      - name: cargo fmt
        run: cargo fmt --all --check

  # clippy and the tests on every system: much of the code is #[cfg(windows)], macOS or Linux
  # only. The whole workspace, the Tauri app included. Here Windows; the Mac is the coverage
  # job, whose tests are the Mac's tests; Linux has a job of its own, without the app.
  clippy-test:
    name: clippy-test (windows-latest)
    needs: needed
    if: needs.needed.outputs.run == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Only the Rust of rust-toolchain.toml: rust-cache puts every installed toolchain in its
      # key, and the runner images come with different ones, so a job kept a cache for each
      # image and often started from an old one.
      - name: Rust
        shell: bash
        run: |
          rustup toolchain install
          active=$(rustup show active-toolchain | cut -d' ' -f1)
          rustup default "$active"
          for toolchain in $(rustup toolchain list --quiet | tr -d '\r'); do
            if [ "$toolchain" != "$active" ]; then rustup toolchain uninstall "$toolchain"; fi
          done
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        shell: bash
        run: cargo test --workspace --locked

  # Linux: what ships there, the command line and the hub without an interface (clak-daemon),
  # and what they are made of. Everything but the Tauri app, which isn't built for Linux.
  linux:
    needs: needed
    if: needs.needed.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Only the Rust of rust-toolchain.toml, as on Windows.
      - name: Rust
        shell: bash
        run: |
          rustup toolchain install
          active=$(rustup show active-toolchain | cut -d' ' -f1)
          rustup default "$active"
          for toolchain in $(rustup toolchain list --quiet | tr -d '\r'); do
            if [ "$toolchain" != "$active" ]; then rustup toolchain uninstall "$toolchain"; fi
          done
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo clippy
        shell: bash
        run: cargo clippy --workspace --exclude clak-app --all-targets --locked -- -D warnings
      - name: cargo test
        shell: bash
        run: cargo test --workspace --exclude clak-app --locked

  # The Mac: clippy, then the tests with coverage (the share of lines they run through: below
  # the floor the check fails), so they are built and run once, not once plain and once for
  # coverage. cargo-llvm-cov leaves out the doc tests, which run apart.
  # The figures go in the run's summary, the report (HTML and lcov) among its artifacts.
  # To raise the floor as the tests grow, change COVERAGE_FLOOR.
  coverage:
    needs: needed
    if: needs.needed.outputs.run == 'true'
    runs-on: macos-latest
    env:
      COVERAGE_FLOOR: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Only the Rust of rust-toolchain.toml, as on Windows.
      - name: Rust
        shell: bash
        run: |
          rustup toolchain install
          active=$(rustup show active-toolchain | cut -d' ' -f1)
          rustup default "$active"
          for toolchain in $(rustup toolchain list --quiet | tr -d '\r'); do
            if [ "$toolchain" != "$active" ]; then rustup toolchain uninstall "$toolchain"; fi
          done
          rustup component add llvm-tools
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests with coverage
        shell: bash
        run: cargo llvm-cov --workspace --locked --no-report
      - name: Doc tests
        shell: bash
        run: cargo test --workspace --locked --doc
      - name: Report
        shell: bash
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --html --output-dir coverage
          {
            echo "## Coverage"
            echo
            echo '```'
            cargo llvm-cov report --summary-only | sed -n '1p;$p'
            echo '```'
            echo
            echo "The floor for lines is $COVERAGE_FLOOR%."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: |
            lcov.info
            coverage/html
      - name: Floor
        shell: bash
        run: cargo llvm-cov report --summary-only --fail-under-lines "$COVERAGE_FLOOR" > /dev/null
