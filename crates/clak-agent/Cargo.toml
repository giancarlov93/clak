[package]
name = "clak-agent"
description = "The agent side: the clak command line and the MCP shim"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The two executables live in src/bin: `clak` (the command line) and `clak-shim`
# (the MCP server over stdio). Synchronous, no runtime: they start on every agent command.

[dependencies]
clak-wire.workspace = true
serde_json.workspace = true
base64.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The tests' fake hub: a named pipe server.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }
