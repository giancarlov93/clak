[package]
name = "clak-app"
description = "The Clak app: tray, notifications, consent windows and panel, with the hub inside"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
# Not "Clak": clak.exe sits next to it, and Windows is case-insensitive.
name = "ClakApp"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clak-wire.workspace = true
clak-hub.workspace = true
clak-host.workspace = true
clak-setup.workspace = true
clak-agent.workspace = true
clak-connectors.workspace = true
clak-apis.workspace = true
clak-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
base64.workspace = true
reqwest.workspace = true
# The servers' icons: PNG and ICO in, PNG out (Tauri already has the crate, with PNG).
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
resvg = { version = "0.48.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["block2", "NSData", "NSGeometry", "NSNotification", "NSOperation", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["block2", "NSAppearance", "NSButton", "NSColor", "NSColorSpace", "NSControl", "NSGraphics", "NSImage", "NSResponder", "NSRunningApplication", "NSSound", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWorkspace", "objc2-core-foundation"] }

[target.'cfg(windows)'.dependencies]
png = "0.17"
windows-sys = { version = "0.60", features = ["Wdk_System_SystemServices", "Win32_System_SystemInformation", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug", "Win32_Media_Audio", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Console"] }
